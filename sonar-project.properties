# SonarQube/SonarCloud project config for the "static analysis" pipeline
# stage. Run from the repo root (`sonar-scanner`), picked up automatically
# because this file is named sonar-project.properties.

sonar.projectKey=tasktracker-ci-cd
sonar.projectName=Task Tracker CI/CD
sonar.sourceEncoding=UTF-8

# Both tiers' application code, excluding their own test suites (listed
# separately below so Sonar treats them as tests, not production code).
sonar.sources=app/backend/app,app/frontend/app.py,app/frontend/backend_client.py
sonar.tests=app/backend/tests,app/frontend/tests

# Coverage reports produced by `pytest --cov --cov-report=xml` in the
# Jenkinsfile's Test stage, one per tier.
sonar.python.coverage.reportPaths=app/backend/coverage.xml,app/frontend/coverage.xml

sonar.exclusions=**/__pycache__/**,**/.venv/**,**/node_modules/**
