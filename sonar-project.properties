# SonarQube/SonarCloud project config for the "static analysis" pipeline
# stage. Run from the repo root (`sonar-scanner`), picked up automatically
# because this file is named sonar-project.properties.

# Both values come from the SonarQube Cloud project page. Neither is a
# secret (the secret is the token, which lives only in Jenkins' credential
# store). The server URL is not set here: Jenkins injects it through
# withSonarQubeEnv, so the same file works against any Sonar server.
sonar.organization=l00205332
sonar.projectKey=L00205332_L00205332-SW-DevOps-CA3-CA4-Pipeline
sonar.projectName=Task Tracker CI/CD (L00205332 SW DevOps CA3/CA4)
sonar.sourceEncoding=UTF-8

# No sonar.sources / sonar.tests here on purpose: SonarQube Cloud's current
# analysis scope analyses the whole project by default and reported those
# two properties as having no effect. The main-code vs test-code split is
# managed in the project's settings on the Sonar side instead.

# Our containers run Python 3.12, so tell Sonar - it otherwise assumes
# "3.10 through 3.15" and analyses less precisely.
sonar.python.version=3.12

# Coverage reports produced by `pytest --cov --cov-report=xml` in the
# Jenkinsfile's Test stage, one per tier (stashed there, unstashed in the
# Sonar stage, with paths prefixed so they match the repo layout).
sonar.python.coverage.reportPaths=app/backend/coverage.xml,app/frontend/coverage.xml

# Generated files that are not source code: virtualenvs, caches, and the
# test/coverage reports the pipeline writes into the workspace.
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/node_modules/**,**/test-results.xml,**/coverage.xml

# SonarQube Cloud is ADVISORY by design: it reports code quality, coverage
# and security findings (with its quality gate visible on the project page)
# but never fails the pipeline. The blocking security gates are Bandit,
# Trivy and Gitleaks. Its findings are triaged by hand instead (fixed, or
# accepted with a written justification - see docs/engineering-log.md, C10).
# To make it blocking later: sonar.qualitygate.wait=true
